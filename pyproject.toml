[project]
name = "momcare-backend"
version = "0.1.0"
description = "Modular maternal-health software suite"
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "MomCare", email = "admin@momcare.example" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi>=25.1.0",
  "celery>=5.6.3",
  "django",
  "django-celery-beat>=2.9.0",
  "django-cors-headers>=4.9.0",
  "django-environ>=0.13.0",
  "django-filter>=25.2",
  "django-storages[s3]>=1.14.6",
  "djangorestframework>=3.17.1",
  "djangorestframework-simplejwt>=5.5.1",
  "drf-spectacular>=0.29.0",
  "gunicorn>=26.0.0",
  "psycopg[binary]>=3.3.3",
  "python-json-logger>=4.1.0",
  "redis>=8.0.0",
  "django-timezone-field>=7.1",
  "uvicorn>=0.49.0",
  "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.13.5",
  "django-coverage-plugin>=3.2.2",
  "django-debug-toolbar>=6.3.0",
  "django-extensions>=4.1",
  "django-stubs[compatible-mypy]>=6.0.2",
  "django-upgrade>=1.30.0",
  "factory-boy>=3.3.3",
  "import-linter>=2.0",
  "mypy>=1.20.1",
  "pre-commit>=4.5.1",
  "pytest",
  "pytest-django>=4.12.0",
  "ruff>=0.15.10",
]

[tool.ruff]
line-length = 119
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [ "B", "DJ", "E4", "E7", "E9", "F", "I", "UP" ]
lint.ignore = [ "B008", "E501" ]
lint.per-file-ignores."*/migrations/*" = [ "E", "F", "I" ]
lint.per-file-ignores."*/tests/*" = [ "ARG", "S101" ]
lint.per-file-ignores."config/settings/*" = [ "E501", "F403", "F405" ]

[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
  "mypy_django_plugin.main",
]
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest]
# ==== pytest ====
ini_options.minversion = "6.0"
ini_options.addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib --basetemp=.pytest_tmp"
ini_options.python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "momcare_platform/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]

[tool.importlinter]
root_packages = [ "momcare_platform", "config" ]

[[tool.importlinter.contracts]]
name = "core must not import modules"
type = "forbidden"
source_modules = [ "momcare_platform.core" ]
forbidden_modules = [ "momcare_platform.modules" ]

[[tool.importlinter.contracts]]
name = "project wiring must not hard-import modules"
type = "forbidden"
source_modules = [ "config.api_router" ]
forbidden_modules = [ "momcare_platform.modules" ]

# NOTE: an "independence" contract listing individual feature-module packages
# (like Neuro_RPM's "programs are independent" contract) gets added here once
# the first module exists under momcare_platform/modules/ — there's nothing to
# check independence between yet.
